<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Crowdpromotion</title>
<meta name="description" content="Crowdpromotion connects idle venues, local organisers, attendees and social projects in Madrid. Every ticket is split transparently.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script id="leafletjs" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --mist:#F5F5F7; --ink:#1D1D1F; --graphite:#6E6E73; --quiet:#86868B;
  --hair:rgba(0,0,0,.08); --hair-strong:rgba(0,0,0,.14);
  --blue:#1F5BFF; --orange:#FF7A1A; --green:#1E9E61; --violet:#7A5AF8; --red:#E3263A;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.9);
  --shadow-float:0 1px 1px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.06);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 10px 30px -12px rgba(20,30,60,.14);
  --r-xl:36px; --r-lg:28px; --r-md:20px; --r-sm:14px;
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Inter","Helvetica Neue","Microsoft YaHei",sans-serif;
}
@supports (corner-shape: squircle){:root{--r-xl:56px;--r-lg:44px;--r-md:32px;--r-sm:22px}.sq{corner-shape:squircle}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;overflow-x:hidden}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.leaflet-container img{max-width:none!important;display:inline}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}
.muted{color:var(--graphite)}.small{font-size:13.5px}.center{text-align:center}
.fine{font-size:12px;color:var(--quiet);line-height:1.5;margin:12px 0 0}
.kicker{font-size:15px;font-weight:600;color:var(--graphite);margin:0 0 12px;letter-spacing:-.01em}
.lab{font-size:13px;font-weight:600;color:var(--graphite);margin:0 0 6px}
.empty{color:var(--quiet);font-size:15px;padding:10px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-b{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.cta.center{justify-content:center}
.note{background:var(--mist);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--ink);margin:14px 0}
.warn{color:#A3470B;font-size:13.5px;margin:6px 0 0}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--shadow-float)}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.12em}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}

/* ---------- buttons, chips, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--hair-strong);background:#fff;color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;transition:transform .4s var(--ease),background .25s,box-shadow .3s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(0,0,0,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-white{background:#fff;color:var(--ink);border-color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--graphite)}
.btn-s{min-height:36px;padding:0 14px;font-size:14px}
.btn-l{min-height:54px;font-size:16px;font-weight:600}
.btn-block{width:100%;margin-top:14px}
.btn.loading{color:transparent!important;position:relative;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-size:13.5px;font-weight:500}
.more{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--blue);margin-top:14px;text-decoration:none;border:0;background:none;padding:0;cursor:pointer}
.more .ic{transition:transform .3s var(--ease)}.more:hover .ic{transform:translateX(3px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin-bottom:18px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--hair-strong);background:#fff;border-radius:999px;font-size:13.5px;padding:7px 14px;cursor:pointer;color:var(--graphite);display:inline-flex;align-items:center;gap:7px;transition:all .3s var(--ease)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-sep{width:1px;height:22px;background:var(--hair-strong);flex:none;margin:0 4px}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.06);white-space:nowrap}
.p-ok{background:rgba(30,158,97,.12);color:#137a4a}.p-open{background:rgba(255,122,26,.13);color:#B4530D}
.p-wait{background:rgba(255,190,0,.18);color:#7A5B00}.p-bad{background:rgba(227,38,58,.1);color:#B01C2C}.p-done{background:rgba(122,90,248,.12);color:#5137C2}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;letter-spacing:.01em;vertical-align:middle}
.ke{background:repeating-linear-gradient(135deg,rgba(255,122,26,.14) 0 5px,rgba(255,122,26,.06) 5px 10px);color:#A3470B}
.kt{background:rgba(30,158,97,.13);color:#137a4a}
.tagp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);padding:3px 10px;border-radius:999px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-weight:600;flex:none;vertical-align:middle;box-shadow:0 0 0 2px #fff}
.av-xs{width:20px;height:20px;font-size:10px}.av-sm{width:28px;height:28px;font-size:12px}.av-md{width:38px;height:38px;font-size:15px}.av-lg{width:52px;height:52px;font-size:20px}.av-xl{width:84px;height:84px;font-size:34px}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#EDEFF3,#F7F2EC)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),opacity .6s}
.ph.noimg img{opacity:0}
.ph.sm{width:48px;height:48px;border-radius:14px;flex:none}

/* ---------- nav ---------- */
.nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;max-width:calc(100vw - 24px);transition:box-shadow .4s}
.nav .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;white-space:nowrap;margin-right:6px;text-decoration:none}
.nav .brand i{width:20px;height:20px;border-radius:7px;background:conic-gradient(from 200deg,var(--blue),var(--orange),var(--green),var(--violet),var(--blue));display:block}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{font-size:13px;color:var(--graphite);text-decoration:none;padding:7px 11px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.links a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.links a.on{color:var(--ink);background:rgba(0,0,0,.06)}
.seg{display:inline-flex;position:relative;background:rgba(118,118,128,.12);border-radius:999px;padding:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--graphite);transition:color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.06);transition:left .35s var(--ease),width .35s var(--ease)}
.navbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);transition:background .2s;flex:none}
.navbtn:hover{background:rgba(0,0,0,.05)}
.navbtn.on{background:var(--ink);color:#fff}
#navStudio{background:var(--ink);color:#fff}
@media (max-width:900px){.links{display:none}.nav{padding-left:14px;gap:4px}#navStudio span{display:none}#navStudio{padding:0 10px}}
@media (max-width:380px){.nav .brand span{display:none}}
.fabnav{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:none;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px;border:0}
.fabmenu{display:flex;flex-direction:column;padding:8px;border-radius:var(--r-md);min-width:190px;transform-origin:100% 100%;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .25s}
.fabnav.open .fabmenu{transform:none;opacity:1;pointer-events:auto}
.fabmenu a{text-decoration:none;font-size:15px;padding:10px 14px;border-radius:14px}
.fabmenu a.on,.fabmenu a:hover{background:rgba(0,0,0,.06)}
@media (max-width:900px){body[data-view="site"] .fabnav{display:flex}}

/* ---------- hero ---------- */
.hero{padding-top:118px}
.hero.slim{padding-bottom:10px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 24px;font-size:14px;color:var(--quiet)}
.hero h1{text-wrap:balance;font-size:clamp(40px,6vw,82px);line-height:1.02;letter-spacing:-.045em;font-weight:700;margin:0 0 22px}
html[data-lang="es"] .hero h1{font-size:clamp(36px,5.2vw,72px)}
.lede{font-size:clamp(18px,1.7vw,21px);line-height:1.5;color:var(--graphite);max-width:34em;margin:0}
.lede b{color:var(--ink);font-weight:600}
.mosaic{position:relative;height:clamp(380px,46vw,560px)}
.mosaic .ph{position:absolute;border-radius:var(--r-lg);box-shadow:0 30px 60px -30px rgba(20,30,60,.35)}
.mosaic .m1{inset:0 18% 22% 0;animation:floaty 9s ease-in-out infinite}
.mosaic .m2{width:44%;height:46%;right:0;top:8%;animation:floaty 10s ease-in-out -3s infinite}
.mosaic .m3{width:50%;height:40%;right:6%;bottom:0;animation:floaty 11s ease-in-out -6s infinite}
.mosaic .float{position:absolute;border-radius:22px;padding:12px 16px;display:grid;gap:2px;animation:floaty 7s ease-in-out -2s infinite}
.mosaic .float small{font-size:12px;color:var(--graphite)}
.mosaic .float b{font-size:26px;letter-spacing:-.04em;line-height:1.1}
.mosaic .f1{left:-4%;bottom:12%}.mosaic .f2{right:-2%;top:-2%}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mosaic.in .ph img{animation:kenburns 14s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.kstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:56px 0 0;padding-top:26px;border-top:1px solid var(--hair)}
.kstats b{display:block;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.045em;line-height:1.05;font-weight:700}
.kstats>div>span{font-size:14px;color:var(--graphite)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.mosaic{height:380px;margin-top:10px}.kstats{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.hero{padding-top:96px}.mosaic{height:300px}.mosaic .float b{font-size:20px}}

/* marquee */
.marquee{margin:64px 0 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;gap:12px;width:max-content;animation:marquee 46s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.mq{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--mist);border:0;cursor:pointer;text-align:left}
.mq .ph.sm{border-radius:50%;width:44px;height:44px}
.mq b{display:block;font-size:14px;font-weight:600;white-space:nowrap}.mq small{font-size:12px;color:var(--graphite);white-space:nowrap}

/* ---------- sections ---------- */
section{padding:120px 0 0}
section.first{padding-top:56px}
@media (max-width:640px){section{padding-top:84px}}
.sh{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:40px}
.sh h2{text-wrap:balance;font-size:clamp(32px,4.2vw,54px);line-height:1.05;letter-spacing:-.04em;margin:0;font-weight:700}
.sh p{margin:0;color:var(--graphite);font-size:18px;line-height:1.55;max-width:34em}
@media (max-width:860px){.sh{grid-template-columns:1fr;gap:14px}}
.h2s{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;margin:0 0 10px;font-weight:700;line-height:1.1}
.subh{font-size:24px;letter-spacing:-.03em;margin:64px 0 18px}
.tap{cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.tap:hover{transform:translateY(-3px)}
.tap:active{transform:scale(.985)}

/* explore cards */
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.agrid{grid-template-columns:1fr}}
.acard{position:relative;display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--mist);border-radius:var(--r-lg);overflow:hidden}
.acard:hover{box-shadow:var(--shadow-card)}
.acard-ph{height:200px}
.acard:hover .acard-ph img{transform:scale(1.06)}
.acard-date{position:absolute;top:14px;left:14px;display:grid;text-align:center;line-height:1.05;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:7px 11px;font-size:11px;font-weight:600;color:var(--graphite);text-transform:uppercase}
.acard-date b{font-size:21px;color:var(--ink);letter-spacing:-.03em}
.acard-price{position:absolute;top:14px;right:14px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
.acard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.acard-meta{font-size:12.5px;color:var(--graphite);font-weight:500;text-transform:capitalize}
.acard h3{margin:0;font-size:20px;letter-spacing:-.025em;line-height:1.2;font-weight:600}
.acard-where{font-size:13.5px;color:var(--graphite);display:flex;align-items:center;gap:5px}
.acard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-top:2px}
.acard-foot>span:first-child{display:flex;align-items:center;gap:6px}
.acard-left{font-size:12px;color:var(--quiet)}
.prog{position:relative;height:6px;border-radius:6px;background:rgba(0,0,0,.07);margin:8px 0 4px}
.prog b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ink);width:0;transition:width 1.4s var(--ease) .2s}
.in .prog b,.prog.in b{width:var(--w)}
.prog .pmin{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--orange)}

/* ---------- map ---------- */
.mapstage{max-width:1440px;margin:0 auto;padding:0 20px}
@media (max-width:640px){.mapstage{padding:0 10px}}
.mapcard{position:relative;height:min(78vh,780px);min-height:520px;border-radius:var(--r-xl);overflow:hidden;background:#F2F3F5;border:1px solid var(--hair);box-shadow:0 30px 80px -30px rgba(20,30,60,.18)}
.leaflet-host{position:absolute;inset:0;z-index:1;background:#EEF0F3}
.map-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--graphite);font-size:14px;padding:30px;text-align:center}
.leaflet-container{font-family:var(--font)}
.mlegend{position:absolute;top:18px;left:18px;bottom:18px;width:300px;border-radius:var(--r-lg);padding:18px 14px 12px;z-index:500;display:flex;flex-direction:column}
.mlegend h3{font-size:15px;margin:0 6px 8px;font-weight:600;letter-spacing:-.02em}
.mkeys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--graphite);margin:0 6px 10px}
.mkeys i,.nkeys i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.k-v{border-radius:3px;background:var(--blue)}.k-p{border-radius:50%;background:var(--green)}.k-o{border-radius:50%;background:var(--orange)}
.k-f{height:0!important;width:16px!important;border-top:2px dashed var(--green)}.k-r{height:0!important;width:16px!important;border-top:2px dashed var(--violet)}
.mlist{overflow-y:auto;flex:1;display:grid;gap:2px;align-content:start}
.mrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:16px;cursor:pointer;transition:background .2s}
.mrow:hover{background:rgba(0,0,0,.045)}
.mrow b{display:block;font-size:14px;font-weight:600}.mrow small{font-size:12px;color:var(--graphite)}
.mdot{width:48px;height:48px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:inset 0 0 0 3px var(--c)}
.mk{position:relative;border-radius:16px;box-shadow:0 8px 20px -6px rgba(0,0,0,.35);border:3px solid #fff;overflow:visible;transition:transform .3s var(--ease)}
.mk:hover{transform:scale(1.08)}
.mk img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.mk-v{width:52px;height:52px}
.mk-v span{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.mk-p{width:44px;height:44px;border-radius:50%;border-color:var(--c)}
.mk-p img{border-radius:50%}
.mk-p i{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--c);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.flowline{stroke-dasharray:3 9;animation:dash 1.6s linear infinite}
.flowline.fl1{animation-duration:2s}.flowline.fl2{animation-duration:2.4s}
@keyframes dash{to{stroke-dashoffset:-24}}
.leaflet-popup-content-wrapper{border-radius:22px;padding:0;overflow:hidden;box-shadow:var(--shadow-float)}
.leaflet-popup-content{margin:0;width:260px!important}
.pop{display:grid;gap:2px;padding:0 0 12px}
.pop .pop-ph{height:120px;margin-bottom:10px}
.pop>b{font-size:16px;padding:0 14px;letter-spacing:-.02em}.pop>small{font-size:12px;color:var(--graphite);padding:0 14px 6px}
.pop-a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--hair);font-size:13px}
.pop-a small{display:block;color:var(--graphite);font-size:11.5px}

@media (max-width:1000px){

  .mlegend{position:relative;inset:auto;width:auto;border-radius:0;background:#fff;box-shadow:none;border:0;border-top:1px solid var(--hair);backdrop-filter:none;-webkit-backdrop-filter:none}
  .mlist{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* ---------- money ---------- */
.money{display:grid;grid-template-columns:1.25fr .9fr;gap:16px;align-items:stretch}
@media (max-width:920px){.money{grid-template-columns:1fr}}
.flowcard{background:var(--mist);border-radius:var(--r-lg);padding:22px 18px;display:flex;align-items:center}
.flowcard>div{width:100%}
.flow{width:100%;height:auto;display:block;overflow:visible}
.fl-base{fill:none;opacity:.22;stroke-linecap:butt}
.fl-dash{fill:none;stroke:#fff;stroke-dasharray:2 14;stroke-linecap:round;opacity:.9;animation:dash 1.1s linear infinite}
.fl-l{font-size:16px;font-weight:600;fill:var(--ink)}.fl-v{font-size:14.5px;fill:var(--graphite);font-variant-numeric:tabular-nums}
.fl-src rect{fill:var(--ink)}.fl-sv{fill:#fff;font-size:17px;font-weight:700;text-anchor:middle;letter-spacing:-.03em}.fl-ss{fill:rgba(255,255,255,.65);font-size:11.5px;text-anchor:middle}
.money.in .flow g{animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
@keyframes grow{from{opacity:0;transform:translateX(-14px)}}
.calc{border-radius:var(--r-lg);background:var(--ink);color:#fff;padding:28px}
.calc h3{margin:0 0 4px;font-size:21px;letter-spacing:-.03em;font-weight:600}

.rng{margin:0 0 16px}
.rng label{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;color:rgba(255,255,255,.8)}
.rng label b{color:#fff;font-weight:600}
.rng.light label{color:var(--graphite)}.rng.light label b{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.18);outline-offset:6px;margin:6px 0}

input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.out{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.out div{background:rgba(255,255,255,.07);border-radius:18px;padding:12px 14px}
.out div.wide{grid-column:1/-1}
.out b{display:block;font-size:24px;letter-spacing:-.04em;font-weight:600}
.out span{font-size:12px;color:rgba(255,255,255,.6)}
.calc .fine{color:rgba(255,255,255,.5)}
.chainstory{margin-top:16px;border-radius:var(--r-lg);border:1px solid var(--hair);padding:28px}
.cs-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:end;margin-bottom:22px}

.cflow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cnode{display:grid;justify-items:center;text-align:center;gap:4px;background:var(--mist);border-radius:var(--r-md);padding:16px 14px;min-width:132px;flex:1}
.cnode b{font-size:15px}.cnode .num{font-size:24px;font-weight:700}.cnode small{font-size:12px;color:var(--graphite);line-height:1.3}
.cph{width:52px;height:52px;border-radius:50%}
.carrow{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--quiet);min-width:60px}
.carrow i{display:block;width:48px;height:2px;background:linear-gradient(90deg,var(--violet) 50%,transparent 0) 0 0/10px 2px;animation:slide 1s linear infinite}
.carrow.alt i{background-image:linear-gradient(90deg,var(--green) 50%,transparent 0)}
@keyframes slide{to{background-position:10px 0}}
@media (max-width:760px){.cs-head{grid-template-columns:1fr;gap:8px}.carrow{min-width:100%;}.carrow i{width:2px;height:22px;background:linear-gradient(180deg,var(--violet) 50%,transparent 0) 0 0/2px 10px}.carrow.alt i{background-image:linear-gradient(180deg,var(--green) 50%,transparent 0)}}

/* ---------- network ---------- */
.netwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:920px){.netwrap{grid-template-columns:minmax(0,1fr)}}
.netwrap>*,.money>*,.sh-grid>*,.hero-grid>*{min-width:0}
.netcard{background:var(--mist);border-radius:var(--r-lg);padding:20px}
.net{width:100%;height:auto;display:block}
.ct{font-size:12px;font-weight:600;fill:var(--quiet);text-anchor:middle;text-transform:uppercase;letter-spacing:.06em}
.ne{fill:none;stroke:#C9CED6;stroke-linecap:round;transition:opacity .35s,stroke .35s}
.net.intro .ne{stroke-dasharray:1;stroke-dashoffset:1}
.netwrap.in .net.intro .ne{animation:draw 1.4s var(--ease) forwards;animation-delay:calc(.4s + var(--i)*80ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.ne-r{stroke:var(--violet);stroke-width:2.5;stroke-dasharray:6 6!important;animation:dash 1.4s linear infinite!important}
.ne-c{stroke:var(--orange);stroke-width:2.5;stroke-dasharray:2 5!important}
.ne.dim,.nn.dim{opacity:.12}
.nn{cursor:pointer;outline:none;transition:opacity .35s}
.nn-in{transition:transform .4s var(--ease)}
.net.intro .nn-in{transform:scale(0)}
.netwrap.in .net.intro .nn-in{animation:pop .7s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes pop{to{transform:scale(1)}}
.nn:hover .nn-in,.nn.sel .nn-in{transform:scale(1.12)}
.nn text{text-anchor:middle}
.ni{font-size:19px;font-weight:700;fill:#fff}
.nl{font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--mist);stroke-width:5px}
.nring{fill:none;stroke-width:3}.nr-v{stroke:var(--blue)}.nr-j{stroke:var(--green)}
.nn.sel circle,.nn.sel .nring{stroke:var(--ink);stroke-width:4}
.nkeys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--graphite);margin-top:8px}
.netside .story{background:#fff;border:1px solid var(--hair);border-radius:var(--r-lg);padding:24px;height:100%}
.story h3{margin:0 0 8px;font-size:22px;letter-spacing:-.03em}.story p{margin:0;color:var(--graphite);font-size:15px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kv div{background:var(--mist);border-radius:16px;padding:10px 12px;min-width:0}
.kv b{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
.kv div>span{font-size:11.5px;color:var(--graphite);line-height:1.3;display:block}
.kv3{grid-template-columns:repeat(3,minmax(0,1fr))}.kv4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.kv4{grid-template-columns:1fr 1fr}}
.alist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.alist li{font-size:14px}.alist small{display:block;color:var(--graphite);font-size:12px}
.recur{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;align-items:center;margin-top:16px;border-radius:var(--r-lg);border:1px solid var(--hair);padding:30px}
.recur p{margin:0;color:var(--graphite)}
.big{font-size:clamp(56px,7vw,92px);font-weight:700;letter-spacing:-.06em;line-height:1;margin:0 0 10px}
.ratio{display:flex;height:14px;border-radius:14px;overflow:hidden;gap:3px;margin-bottom:10px}
.ratio i{display:block;width:0;transition:width 1.6s var(--ease) .3s}
.in .ratio i{width:var(--w)}
.ratiol{display:flex;gap:16px;font-size:13px;color:var(--graphite)}
.ratiol span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
.fine.dark{color:var(--graphite);font-size:13.5px}
@media (max-width:760px){.recur{grid-template-columns:1fr;gap:16px}}

/* ---------- projects ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr}}
.pcard{border-radius:var(--r-lg);overflow:hidden;background:#fff;border:1px solid var(--hair);display:flex;flex-direction:column}
.pph{height:210px}
.pcard:hover .pph img{transform:scale(1.05)}
.pbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{margin:0;font-size:24px;letter-spacing:-.03em}
.pbody p{margin:0;color:var(--graphite);font-size:14.5px}
.praised{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.praised b{font-size:34px;letter-spacing:-.05em;font-weight:700}.praised>span{font-size:13px;color:var(--graphite)}
.pbar{position:relative;height:10px;border-radius:10px;background:rgba(0,0,0,.06);overflow:hidden}
.pbar b{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:10px;transition:width 1.6s var(--ease) .3s}
.pbar b.exp{border-radius:0 10px 10px 0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.18) 0 4px,rgba(0,0,0,.06) 4px 8px)}
.in .pbar b{width:var(--w)}
.pmeta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--graphite)}
.avs{display:flex}.avs .av{margin-left:-6px}.avs .av:first-child{margin-left:0}
.pact{display:flex;gap:8px;margin-top:auto;padding-top:8px}

/* ---------- organise ---------- */
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:l}
.lstep{border-radius:var(--r-lg);overflow:hidden;background:var(--mist);position:relative}
.lph{height:170px}
.lbody{padding:20px 22px 22px}
.lix{font-size:12px;font-weight:700;color:var(--quiet)}
.lbody h3{margin:6px 0 6px;font-size:22px;letter-spacing:-.03em}.lbody p{margin:0 0 10px;color:var(--graphite);font-size:14.5px}
.lbody small{font-size:12.5px;color:#137a4a;background:rgba(30,158,97,.1);padding:5px 10px;border-radius:10px;display:inline-block}
.lstep:not(:last-child)::after{content:"→";position:absolute;right:-14px;top:150px;z-index:2;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-float);font-size:14px}
@media (max-width:900px){.ladder{grid-template-columns:1fr}.lstep:not(:last-child)::after{display:none}}
.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.fcard{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hair);background:#fff}
.fph{height:110px}
.fbody{padding:12px 14px 14px}
.fbody h4{margin:0 0 8px;font-size:15px;letter-spacing:-.02em}
.fstats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 12px;font-size:11px;color:var(--graphite)}
.fstats b{display:block;font-size:15px;color:var(--ink);letter-spacing:-.02em}
.fbody small{display:block;margin-top:8px;font-size:11.5px;color:var(--quiet)}
.ctaband{margin-top:56px;border-radius:var(--r-xl);background:var(--ink);color:#fff;padding:44px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.ctaband::before{content:"";position:absolute;width:520px;height:520px;right:-160px;top:-260px;border-radius:50%;background:conic-gradient(from 90deg,var(--blue),var(--orange),var(--green),var(--violet),var(--blue));filter:blur(70px);opacity:.45;animation:spin 18s linear infinite}
.ctaband>*{position:relative}
.ctaband h3{margin:0 0 8px;font-size:clamp(26px,3vw,38px);letter-spacing:-.04em;line-height:1.1}

.ctaband .btn:not(.btn-ink){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}

footer{padding:90px 0 60px;color:var(--quiet);font-size:13.5px}

/* ---------- donut, legend, split ---------- */
.dwrap{display:grid;place-items:center;margin:8px 0 14px}
.donut{width:min(200px,60vw);height:auto;overflow:visible}
.dwrap.sm .donut{width:150px}
.donut circle{fill:none;stroke-width:26;stroke-dasharray:0 999;stroke-dashoffset:var(--off);transition:stroke-dasharray 1.1s var(--ease),stroke-width .3s;transition-delay:calc(.2s + var(--i)*110ms)}
.in .donut circle,.donut.in circle{stroke-dasharray:var(--len) 999}
.donut circle:hover{stroke-width:32}
.d-top{font-size:24px;font-weight:700;text-anchor:middle;letter-spacing:-.03em;fill:var(--ink)}
.d-bot{font-size:12px;text-anchor:middle;fill:var(--graphite)}
.lg{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lg li{display:flex;align-items:center;gap:10px;font-size:14px}
.lg li i{width:10px;height:10px;border-radius:50%;flex:none}
.lg li span{flex:1;min-width:0;line-height:1.25}.lg li small{display:block;font-size:11.5px;color:var(--graphite)}
.stable{display:grid;margin:10px 0}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair)}
.srow:first-child{border-top:0}
.srow>i{width:10px;height:10px;border-radius:50%;flex:none}
.srow>span{flex:1;min-width:0}
.srow span b{display:block;font-size:14.5px;font-weight:600}.srow span small{font-size:12px;color:var(--graphite)}
.srow>b{font-size:15px;font-weight:600;white-space:nowrap}
.srow.tot{border-top:1.5px solid var(--ink);font-weight:600}
.srow.tot>b{font-size:20px}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.bars{height:auto}
.bars .bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 1s var(--ease);transition-delay:calc(var(--i)*55ms)}
.in .bars .bar{transform:none}
.bt{fill:var(--ink)}.be{fill:url(#hatch)}
.cur{fill:rgba(31,91,255,.06)}
.gl{stroke:var(--hair);stroke-width:1}
.ax{font-size:11px;fill:var(--quiet);text-anchor:middle}.ay{text-anchor:start}
.clegend{display:flex;gap:16px;font-size:12.5px;color:var(--graphite);margin-top:8px;flex-wrap:wrap}
.clegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.clegend .bt{background:var(--ink)}.clegend .be{background:repeating-linear-gradient(135deg,#FFB27A 0 3px,#FFE2CC 3px 6px)}.clegend .cw{background:rgba(31,91,255,.15)}
.area{height:110px;margin-top:10px}
.area .fill{opacity:0;transition:opacity 1.2s .6s}
.in .area .fill{opacity:.14}
.area .line{fill:none;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke;transition:stroke-dashoffset 1.8s var(--ease) .2s}
.in .area .line{stroke-dashoffset:0}
.wf .bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .9s var(--ease);transition-delay:calc(var(--i)*180ms)}
.in .wf .bar{transform:none}
.wf .ax{font-size:15px}.wv{font-size:17px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.ring{position:relative;width:var(--s);height:var(--s);flex:none}
.ring svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:rgba(0,0,0,.07)}
.ring-fg{stroke-linecap:round;stroke-dasharray:0 var(--c);transition:stroke-dasharray 1.4s var(--ease) .2s}
.in .ring-fg{stroke-dasharray:var(--len) var(--c)}
.ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.ring-t b{font-size:calc(var(--s)*.2);letter-spacing:-.03em}.ring-t small{font-size:calc(var(--s)*.12);color:var(--graphite)}
.hbar{height:6px;border-radius:6px;background:rgba(0,0,0,.07);position:relative;overflow:hidden;margin-top:6px}
.hbar.big{height:12px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,18,25,.22);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:80}

.sheet .x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:15px}

.ticks{list-style:none;padding:0;margin:0;display:grid;gap:6px}

.who{display:flex;gap:12px;align-items:center;margin:22px 0 4px}

.venue-mini,.pmini{display:flex;gap:12px;align-items:center;background:var(--mist);border-radius:18px;padding:10px;margin-top:12px}

.sh-cta{display:grid;gap:4px;margin-top:20px}

.fact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact div{background:rgba(255,255,255,.75);border:1px solid var(--hair);border-radius:18px;padding:12px 14px}

.pick.on{box-shadow:0 0 0 3px var(--ink),var(--shadow-card)}
.pk-ph{height:140px}
.pk-b{padding:14px 16px 16px;display:grid;gap:6px}
.pk-b>.row-b b{font-size:16px}
.terms{list-style:none;padding:0;margin:4px 0 0;font-size:12.5px;color:var(--graphite);display:grid;gap:3px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px;margin-top:12px}
.filters label{display:grid;gap:4px;font-size:12.5px;color:var(--graphite)}
.wcalc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.wcalc .dwrap{margin:0}.wcalc .donut{width:160px}
@media (max-width:640px){.wcalc{grid-template-columns:1fr}}
.scen{display:grid;gap:12px;margin:16px 0 4px}
.sc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sc span{font-size:13px;color:var(--graphite);grid-column:1/-1}
.sc .hbar{margin:0}.sc .hbar b{background:var(--orange)}
.sc>b{font-size:16px}.sc small{grid-column:2;font-size:11.5px;color:var(--graphite);text-align:right}
.duties{padding-left:18px;font-size:14px;color:var(--graphite)}.duties li{margin-bottom:6px}.duties b{color:var(--ink)}
.big-ok{padding:44px 24px}
.sendanim{font-size:44px;width:88px;height:88px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--mist);animation:fly 2.4s var(--ease) infinite}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(6px,-8px) rotate(-8deg)}70%{transform:translate(-4px,2px) rotate(4deg)}100%{transform:translate(0,0)}}
@media (max-width:1100px){.kpis2{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr 1fr}.span3{grid-column:1/-1}}
@media (max-width:900px){
  .studio{grid-template-columns:1fr;padding:78px 14px 70px;gap:14px}
  .sbar{position:sticky;top:68px;z-index:30;flex-direction:row;align-items:center;padding:6px;border-radius:24px}
  .acct{flex:none}.acct-btn{padding:6px;background:none}.acct-btn>span:not(.av),.acct-btn .chev{display:none}
  .acct-menu{right:auto;width:260px}
  .snav{display:flex;overflow-x:auto;scrollbar-width:none;flex:1}
  .snav::-webkit-scrollbar{display:none}
  .snav a{white-space:nowrap;padding:8px 12px;font-size:14px}
  .snav-out{display:none}
  .sgrid,.sgrid.two{grid-template-columns:1fr}.span2{grid-column:auto}
  .sticky{position:static}
}
@media (max-width:520px){.kpis2{gap:10px}.kpi2{padding:14px}.bal3{grid-template-columns:1fr}.snav a span{display:none}.snav a.on span{display:inline}}

/* ---------- toast + confetti ---------- */
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));z-index:120;transform:translate(-50%,-14px) scale(.96);opacity:0;transition:all .45s var(--ease);background:rgba(29,29,31,.92);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-float);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.ok .ic{color:#5BE39A}.toast.bad{background:rgba(176,28,44,.94)}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;z-index:130;pointer-events:none}
</style>

/* ------------------------------------------------------------------ dates */
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(`${iso}T12:00:00`); d.setDate(d.getDate() + n); return isoOf(d); };
const dow = (iso) => new Date(`${iso}T12:00:00`).getDay();
const daysUntil = (iso) => Math.round((new Date(`${iso}T12:00:00`) - new Date(`${TODAY}T12:00:00`)) / 864e5);
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// k-th previous occurrence of a weekday, strictly before today (k = 0 is the most recent)
function prevDay(day, k = 0) { let iso = addDays(TODAY, -1); while (dow(iso) !== day) iso = addDays(iso, -1); return addDays(iso, -7 * k); }
// k-th next occurrence of a weekday at least `minAhead` days from today
function nextDay(day, k = 0, minAhead = 0) { let iso = addDays(TODAY, minAhead); while (dow(iso) !== day) iso = addDays(iso, 1); return addDays(iso, 7 * k); }
function nextDates(day, count, minAhead = 1) { return Array.from({ length: count }, (_, k) => nextDay(day, k, minAhead)); }
const weekStart = (iso) => addDays(iso, -((dow(iso) + 6) % 7)); // Monday

/* ------------------------------------------------------------------ revenue split */
const SPLIT_BP = { business: 7000, promoter: 1500, project: 800, referral: 300, platform: 400 };
const REFERRAL_BP = [100, 80, 60, 40, 20];
const part = (cents, bp) => Math.round((cents * bp) / 10000);

function uplineChain(personId, people, max = REFERRAL_BP.length) {
  const chain = []; const seen = new Set([personId]);
  let cur = people[personId];
  while (cur && cur.uplineId && chain.length < max && !seen.has(cur.uplineId)) {
    seen.add(cur.uplineId); chain.push(cur.uplineId); cur = people[cur.uplineId];
  }
  return chain;
}

// Lines always sum exactly to salesCents. Empty referral levels + rounding go to the project.
function splitSales({ salesCents, promoterId, coOrganiserId = null, venueId, projectId }, people) {
  const business = part(salesCents, SPLIT_BP.business);
  const promoter = part(salesCents, SPLIT_BP.promoter);
  const platform = part(salesCents, SPLIT_BP.platform);
  const projectBase = part(salesCents, SPLIT_BP.project);
  const referrals = uplineChain(promoterId, people).map((id, i) => ({ key: 'referral', partyType: 'person', partyId: id, level: i + 1, cents: part(salesCents, REFERRAL_BP[i]) }));
  const projectTotal = salesCents - business - promoter - platform - sum(referrals, (r) => r.cents);
  const promoterLines = coOrganiserId
    ? [{ key: 'promoter', partyType: 'person', partyId: promoterId, cents: promoter - Math.floor(promoter / 2), shared: true },
       { key: 'coorganiser', partyType: 'person', partyId: coOrganiserId, cents: Math.floor(promoter / 2), shared: true }]
    : [{ key: 'promoter', partyType: 'person', partyId: promoterId, cents: promoter }];
  const lines = [
    { key: 'business', partyType: 'venue', partyId: venueId, cents: business },
    ...promoterLines, ...referrals,
    { key: 'project', partyType: 'project', partyId: projectId, cents: projectTotal, base: projectBase, fromReferral: projectTotal - projectBase },
    { key: 'platform', partyType: 'platform', partyId: 'platform', cents: platform },
  ];
  return { salesCents, lines, check: sum(lines, (l) => l.cents) };
}

function hashStr(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function attendeeNames(id, n, withMe) {
  const pool = [...NAMES]; let h = hashStr(id);
  for (let i = pool.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; const j = h % (i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const names = pool.slice(0, withMe ? n - 1 : n);
  return withMe ? [ME_NAME, ...names] : names;
}
function makeEdition(id, activityId, editionNo, date, n, status, withMe = false) {
  const attendees = attendeeNames(id, n, withMe);

}

  // Earlier balances were already paid out on the last Monday-run payout.

  for (const key of ['person:ana', 'person:luis', 'person:javier', 'venue:tertulia', 'venue:libros']) {

/* ------------------------------------------------------------------ store */
const STORE_KEY = 'crowdpromo-v2';
let state;
const listeners = new Set();
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s.version === SEED_VERSION) return s; } } catch (e) { /* private mode */ }
  return createSeed();
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
function update(fn) { fn(state); maintain(state); saveState(); listeners.forEach((l) => l()); }

const actions = {};

// Keeps the calendar alive: auto-cancels below-minimum editions 48h before and schedules the next recurring edition.
function maintain(s) {
  for (const ed of Object.values(s.editions)) {
    if (ed.status !== 'scheduled') continue;
    const act = s.activities[ed.activityId];
    if (ed.attendees.length < act.minBookings && daysUntil(ed.date) <= 2) { ed.status = 'cancelled'; ed.refundedCents = ed.attendees.length * act.priceCents; ed.cancelledAt = TODAY; }
  }
  const STEP = { weekly: 7, 'every 2 weeks': 14, monthly: 28 };
  for (const act of Object.values(s.activities)) {
    if (act.status !== 'active' || !STEP[act.recurrence]) continue;
    const eds = Object.values(s.editions).filter((e) => e.activityId === act.id).sort((a, b) => a.date.localeCompare(b.date));
    if (eds.some((e) => e.status === 'scheduled' && e.date >= TODAY)) continue;
    const last = eds[eds.length - 1];
    let date = last ? addDays(last.date, STEP[act.recurrence]) : nextDay(WEEKDAYS.indexOf(act.day), 0, 3);
    while (daysUntil(date) < 3) date = addDays(date, STEP[act.recurrence]);
    const id = `${act.id.replace('act-', 'e-')}-${(last?.editionNo || 0) + 1}`;
    s.editions[id] = { id, activityId: act.id, editionNo: (last?.editionNo || 0) + 1, date, status: 'scheduled', attendees: [], checkins: [], coOrganiserId: null, messages: [], completedAt: null };
  }
}

/* ------------------------------------------------------------------ selectors */
const activityOf = (s, ed) => s.activities[ed.activityId];
const bookings = (ed) => ed.attendees.length;
const salesOf = (s, ed) => bookings(ed) * activityOf(s, ed).priceCents;
const editionsOf = (s, actId) => Object.values(s.editions).filter((e) => e.activityId === actId).sort((a, b) => a.date.localeCompare(b.date));
const countsForLedger = (ed) => ed.status === 'scheduled' || ed.status === 'completed';
const moneyKind = (ed) => (ed.status === 'completed' ? 'Transferred' : 'Expected');

function editionSplit(s, ed) {
  const act = activityOf(s, ed);
  return splitSales({ salesCents: salesOf(s, ed), promoterId: act.promoterId, coOrganiserId: ed.coOrganiserId, venueId: act.venueId, projectId: act.projectId }, s.people);
}
function ticketSplit(s, act, coOrganiserId = null) {
  return splitSales({ salesCents: act.priceCents, promoterId: act.promoterId, coOrganiserId, venueId: act.venueId, projectId: act.projectId }, s.people);
}
function ledgerFor(s, partyType, partyId) {
  const rows = [];
  for (const ed of Object.values(s.editions)) {
    if (!countsForLedger(ed)) continue;
    for (const line of editionSplit(s, ed).lines) {
      if (line.partyType === partyType && line.partyId === partyId && line.cents > 0) rows.push({ ed, act: activityOf(s, ed), line, kind: moneyKind(ed) });
    }
  }
  return rows.sort((a, b) => b.ed.date.localeCompare(a.ed.date));
}
function sumKinds(rows) {
  return rows.reduce((t, r) => { t[r.kind === 'Transferred' ? 'transferred' : 'expected'] += r.line.cents; return t; }, { expected: 0, transferred: 0 });
}
function edStatus(s, ed) {
  const act = activityOf(s, ed);
  if (ed.status === 'completed') return { key: 'completed', tone: 'done' };
  if (ed.status === 'cancelled') return { key: 'cancelled', tone: 'bad' };
  if (ed.status === 'pending') return { key: 'pending', tone: 'wait' };
  if (ed.status === 'declined') return { key: 'declined', tone: 'bad' };
  if (ed.date < TODAY) return { key: 'awaiting', tone: 'wait' };
  return bookings(ed) >= act.minBookings ? { key: 'confirmed', tone: 'ok' } : { key: 'open', tone: 'open' };
}
function templateStats(s, templateId) {
  const t = s.templates[templateId];
  const done = Object.values(s.editions).filter((e) => e.status === 'completed' && s.activities[e.activityId].templateId === templateId);
  if (!done.length) {
    const avg = t.fallback?.avgAttendance ?? t.defaultMin;
    const prom = Math.round(avg * t.defaultPriceCents * 0.15);
    return { editions: 0, avgAttendance: avg, avgPromoterCents: prom, hours: t.hours, perHourCents: Math.round(prom / t.hours), verified: false };
  }
  const prom = sum(done, (e) => sum(editionSplit(s, e).lines.filter((l) => l.key === 'promoter' || l.key === 'coorganiser'), (l) => l.cents)) / done.length;
  return { editions: done.length, avgAttendance: Math.round(sum(done, bookings) / done.length), avgPromoterCents: Math.round(prom), hours: t.hours, perHourCents: Math.round(prom / t.hours), verified: true };
}
function projectStats(s, projectId) {
  const rows = ledgerFor(s, 'project', projectId);
  const totals = sumKinds(rows);
  const donations = sum(s.donations.filter((d) => d.projectId === projectId), (d) => d.cents);
  const byAct = {};
  for (const r of rows) {
    const c = (byAct[r.act.id] ??= { act: r.act, transferred: 0, expected: 0, editions: 0, fromReferral: 0 });
    c[r.kind === 'Transferred' ? 'transferred' : 'expected'] += r.line.cents;
    if (r.kind === 'Transferred') { c.editions += 1; c.fromReferral += r.line.fromReferral; }
  }
  return { ...totals, donations, contributors: Object.values(byAct) };
}
function recurrence(s) {
  let repeat = 0; let first = 0;
  for (const ed of Object.values(s.editions)) if (ed.status === 'completed') { if (ed.editionNo > 1) repeat += salesOf(s, ed); else first += salesOf(s, ed); }
  return { repeat, first, share: repeat + first ? repeat / (repeat + first) : 0 };
}
const promoters = (s) => Object.values(s.people).filter((p) => p.isPromoter);
const upcoming = (s) => Object.values(s.editions).filter((e) => e.status === 'scheduled' && e.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date));
const myEditions = (s) => Object.values(s.editions).filter((e) => e.attendees.includes(ME_NAME)).sort((a, b) => b.date.localeCompare(a.date));
const downline = (s, id) => Object.values(s.people).filter((p) => p.uplineId === id).map((p) => ({ person: p, children: downline(s, p.id) }));

// Account = 'person:<id>' or 'venue:<id>'.
function accountInfo(s, key) {
  const [type, id] = key.split(':');
  const ref = type === 'venue' ? s.venues[id] : s.people[id];
  return { key, type, id, ref, partyType: type === 'venue' ? 'venue' : 'person' };
}
function accountLedger(s, key) { const a = accountInfo(s, key); return ledgerFor(s, a.partyType, a.id); }
function balanceOf(s, key) {
  const t = sumKinds(accountLedger(s, key));
  const paid = sum(s.payouts.filter((p) => p.account === key), (p) => p.cents);
  return { ...t, paid, available: t.transferred - paid };
}
// Weekly series: transferred (completed) and expected (scheduled) per week for an account.
function weeklySeries(s, key, weeksBack = 8, weeksAhead = 3) {
  const rows = accountLedger(s, key);
  const start = addDays(weekStart(TODAY), -7 * weeksBack);
  return Array.from({ length: weeksBack + weeksAhead + 1 }, (_, i) => {
    const from = addDays(start, 7 * i); const to = addDays(from, 7);
    const inWeek = rows.filter((r) => r.ed.date >= from && r.ed.date < to);
    return { from, transferred: sum(inWeek.filter((r) => r.kind === 'Transferred'), (r) => r.line.cents), expected: sum(inWeek.filter((r) => r.kind === 'Expected'), (r) => r.line.cents), current: from === weekStart(TODAY) };

}
function costSettings(s, key) {
  const a = accountInfo(s, key);
  const saved = s.costs[key] || {};
  if (a.type === 'venue') return { perAttendee: saved.perAttendee ?? a.ref.costPerAttendeeCents, fixed: saved.fixed ?? a.ref.fixedCostCents };
  return { hours: saved.hours ?? null, perEdition: saved.perEdition ?? 500 };
}
// Profit for completed editions: revenue - estimated costs.
function profitOf(s, key) {
  const a = accountInfo(s, key); const c = costSettings(s, key);
  const rows = accountLedger(s, key).filter((r) => r.kind === 'Transferred');
  const revenue = sum(rows, (r) => r.line.cents);
  if (a.type === 'venue') {
    const eds = rows.map((r) => r.ed);
    const costs = sum(eds, (e) => c.fixed + bookings(e) * c.perAttendee);
    return { revenue, costs, profit: revenue - costs, hours: null };
  }
  const own = rows.filter((r) => r.line.key === 'promoter' || r.line.key === 'coorganiser');
  const costs = own.length * c.perEdition;
  const hours = sum(own, (r) => c.hours ?? s.templates[r.act.templateId].hours);
  return { revenue, costs, profit: revenue - costs, hours, perHour: hours ? Math.round((sum(own, (r) => r.line.cents) - costs) / hours) : 0 };
}

  return `<svg class="chart bars" viewBox="0 0 ${W} ${h}" role="img" aria-label="${t('weekly_earnings')}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFE2CC"/><rect width="2.5" height="6" fill="#FFB27A"/></pattern></defs>${grid}${bars}</svg>`;
}

// Smooth area line for cumulative values.
function areaChart(values, color = '#1E9E61', h = 120) {
  const W = 400; const max = Math.max(1, ...values); const n = values.length;
  const pts = values.map((v, i) => [(i / Math.max(1, n - 1)) * W, h - 8 - (v / max) * (h - 20)]);
  const d = pts.map((p, i) => (i ? `L${p[0].toFixed(1)},${p[1].toFixed(1)}` : `M${p[0].toFixed(1)},${p[1].toFixed(1)}`)).join(' ');
  return `<svg class="chart area" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W},${h} L0,${h} Z" class="fill" style="fill:${color}"/><path d="${d}" class="line" pathLength="1" style="stroke:${color}"/></svg>`;
}

// Revenue -> costs -> profit waterfall.
function waterfall(revenue, costs, labels) {
  const max = Math.max(1, revenue); const H = 180; const y = (v) => H - 26 - (v / max) * (H - 40);
  const profit = revenue - costs;
  const bars = [
    { x: 20, top: y(revenue), bot: y(0), c: 'var(--ink)', v: revenue, l: labels[0] },
    { x: 150, top: y(revenue), bot: y(Math.max(0, profit)), c: '#E3263A', v: -costs, l: labels[1] },
    { x: 280, top: y(Math.max(0, profit)), bot: y(0), c: '#1E9E61', v: profit, l: labels[2] },
  ];
  return `<svg class="chart wf" viewBox="0 0 400 ${H}" role="img" aria-label="${esc(labels.join(' / '))}">${bars.map((b, i) => `<g style="--i:${i}"><rect class="bar" x="${b.x}" y="${b.top}" width="100" height="${Math.max(2, b.bot - b.top)}" rx="10" fill="${b.c}"/><text x="${b.x + 50}" y="${b.top - 8}" class="wv">${money0(b.v)}</text><text x="${b.x + 50}" y="${H - 6}" class="ax">${esc(b.l)}</text></g>`).join('')}
    <line x1="120" x2="150" y1="${y(revenue)}" y2="${y(revenue)}" class="gl"/><line x1="250" x2="280" y1="${y(Math.max(0, profit))}" y2="${y(Math.max(0, profit))}" class="gl"/></svg>`;
}

// Deterministic QR-like code (visual ticket token).
function qr(seed) {
  const n = 21; let h = hashStr(seed);
  const F = [[0, 0], [n - 7, 0], [0, n - 7]];
  const inF = (x, y) => F.find(([a, b]) => x >= a && x < a + 7 && y >= b && y < b + 7);
  let rects = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    const f = inF(x, y); let on;
    if (f) { const dx = x - f[0]; const dy = y - f[1]; on = dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); } else on = (h >>> 16) % 2 === 0;
    if (on) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<svg class="qr" viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="QR"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><g fill="#1D1D1F">${rects}</g></svg>`;
}

/* ------------------------------------------------------------------ reveal + count-up */
const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' }) : null;
function reveal(el) {
  el.classList.add('in');
  const nums = el.matches('[data-count]') ? [el] : $$('[data-count]', el);
  nums.forEach(runCount);
}
function runCount(el) {
  if (el.dataset.done) return; el.dataset.done = '1';
  const to = Number(el.dataset.count); const fmt = el.dataset.fmt; const from = Number(el.dataset.from || 0);
  if (reduceMotion || !Number.isFinite(to)) { el.textContent = formatCount(to, fmt); return; }
  const t0 = performance.now(); const dur = Number(el.dataset.dur || 1300);
  const step = (now) => { const p = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - p, 4); el.textContent = formatCount(from + (to - from) * e, fmt); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// animate=false: show final state immediately (re-render of the same page).
function armReveals(root, animate = true) {
  $$('.rv', root).forEach((el) => { if (!animate || !io || reduceMotion) { el.classList.add('in'); $$('[data-count]', el).forEach((n) => { n.dataset.done = '1'; }); } else io.observe(el); });
  $$('[data-count]', root).forEach((el) => { if (el.closest('.rv')) return; if (!animate || !io) { el.dataset.done = '1'; } else io.observe(el); });
}

/* ------------------------------------------------------------------ sheet (morphs from the tapped card, like iOS) */
const EASE = 'cubic-bezier(.32,.72,0,1)';
let sheetOrigin = null; let sheetBusy = false; let sheetRender = null; let sheetLastFocus = null;
function morph(sheet, from, to, dur) {
  const f = sheet.getBoundingClientRect();
  const tf = (r) => `translate(${r.left - f.left}px, ${r.top - f.top}px) scale(${Math.max(0.02, r.width / f.width)}, ${Math.max(0.02, r.height / f.height)})`;
  const a = sheet.animate([{ transform: from ? tf(from) : 'none', opacity: from ? 0.4 : 1 }, { transform: to ? tf(to) : 'none', opacity: to ? 0 : 1 }], { duration: dur, easing: EASE, fill: 'forwards' });
  return Promise.race([a.finished, new Promise((r) => setTimeout(r, dur + 120))]);
}
async function openSheet(renderFn, origin) {
  if (sheetBusy) return;
  const sheet = $('#sheet'); sheetBusy = true; sheetRender = renderFn;
  sheetLastFocus = document.activeElement;
  sheetOrigin = origin && origin.nodeType ? origin : null;
  $('#sheetBody').innerHTML = renderFn(); $('#sheetBody').scrollTop = 0;
  armReveals($('#sheetBody'), true);
  sheet.getAnimations().forEach((a) => a.cancel());
  sheet.classList.add('on', 'morph'); $('#scrim').classList.add('on'); document.body.classList.add('locked');
  if (!reduceMotion && sheetOrigin) await morph(sheet, sheetOrigin.getBoundingClientRect(), null, 560);
  sheet.classList.remove('morph'); $('#sheetClose').focus({ preventScroll: true }); sheetBusy = false;
}
function refreshSheet() {
  if (!$('#sheet').classList.contains('on') || !sheetRender) return;
  $('#sheetBody').innerHTML = sheetRender(); armReveals($('#sheetBody'), false);
}
function swapSheet(renderFn) {
  sheetRender = renderFn; const body = $('#sheetBody');
  body.classList.add('swap');
  setTimeout(() => { body.innerHTML = renderFn(); body.scrollTop = 0; armReveals(body, true); body.classList.remove('swap'); }, 160);
}
async function closeSheet() {
  const sheet = $('#sheet');
  if (!sheet.classList.contains('on') || sheetBusy) return;
  sheetBusy = true; $('#scrim').classList.remove('on'); sheet.classList.add('morph');
  const back = sheetOrigin && document.contains(sheetOrigin) ? sheetOrigin.getBoundingClientRect() : null;
  if (!reduceMotion && back && back.width) await morph(sheet, null, back, 420);
  sheet.classList.remove('on', 'morph'); sheet.getAnimations().forEach((a) => a.cancel());
  document.body.classList.remove('locked'); sheetRender = null;
  if (sheetLastFocus) sheetLastFocus.focus?.({ preventScroll: true });
  sheetBusy = false;
}

function toast(msg, tone = '') {
  const el = document.createElement('div');
  el.className = `toast ${tone}`; el.setAttribute('role', 'status'); el.innerHTML = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 400); }, 3000);
}

// Small celebratory burst from an element (settlement, booking).
function burst(el) {
  if (reduceMotion || !el) return;
  const r = el.getBoundingClientRect(); const cols = Object.values(COLORS);
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i'); p.className = 'confetti';
    p.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;background:${cols[i % cols.length]}`;
    document.body.appendChild(p);
    const a = (Math.PI * 2 * i) / 26 + Math.random() * 0.4; const d = 80 + Math.random() * 120;
    p.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 60}px) rotate(${Math.random() * 540}deg) scale(.6)`, opacity: 0 }], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.2,1)' }).onfinish = () => p.remove();
    setTimeout(() => p.remove(), 1800);
  }
}

/* ------------------------------------------------------------------ money flow */
function calcSplit() {
  const sales = calc.price * calc.att;
  // chain org -> u1 -> u2 ... with `levels` uplines
  const ppl = { org: { uplineId: calc.levels ? 'u1' : null } };
  for (let i = 1; i <= calc.levels; i++) ppl[`u${i}`] = { uplineId: i < calc.levels ? `u${i + 1}` : null };
  return splitSales({ salesCents: sales, promoterId: 'org', venueId: 'v', projectId: 'p' }, ppl);
}
function calcParts() {
  const sp = calcSplit(); const g = (k) => sum(sp.lines.filter((l) => l.key === k), (l) => l.cents);
  return [
    { k: 'business', label: t('venue'), cents: g('business'), color: COLORS.business },
    { k: 'promoter', label: t('organiser'), cents: g('promoter'), color: COLORS.promoter },
    { k: 'project', label: t('social_project'), cents: g('project'), color: COLORS.project },
    { k: 'referral', label: t('upline_organisers'), cents: g('referral'), color: COLORS.referral },
    { k: 'platform', label: t('platform'), cents: g('platform'), color: COLORS.platform },
  ];
}
function calcOut() {
  return calcParts().map((p) => `<div><b class="num" style="color:${p.k === 'business' ? '#8FB0FF' : p.color}">${money(p.cents)}</b><span>${p.label}</span></div>`).join('') +
    `<div class="wide"><b class="num">${money(calc.price * calc.att)}</b><span>${t('net_sales')} · ${calc.att} × ${money(calc.price)}</span></div>`;
}
function flowSvg() {
  const parts = calcParts(); const total = sum(parts, (p) => p.cents) || 1;
  const W = 600; const H = 330; const srcX = 92; const dstX = 400; const thick = 190;
  let acc = H / 2 - thick / 2;
  const ys = parts.map((_, i) => 40 + i * ((H - 80) / (parts.length - 1)));
  const paths = parts.map((p, i) => {
    const w = Math.max(2, (p.cents / total) * thick); const y0 = acc + w / 2; acc += w; const y1 = ys[i];

}

/* ------------------------------------------------------------------ map (Leaflet + Esri light-gray tiles) */
let map = null; let mapLayers = {};
function initMap() {
  const host = $('#leaflet');
  if (!host || !window.L) return;
  if (map && map.getContainer() === host) { map.invalidateSize(); return; }
  if (map) { map.remove(); map = null; }
  host.innerHTML = '';
  const s = state;
  map = L.map(host, { zoomControl: false, scrollWheelZoom: false, attributionControl: true, fadeAnimation: false }).setView([40.4215, -3.695], 13);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_';
  L.tileLayer(`${esri}Base/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 18, maxNativeZoom: 16, attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors' }).addTo(map);
  L.tileLayer(`${esri}Reference/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 18, maxNativeZoom: 16, pane: 'shadowPane', opacity: 0.85 }).addTo(map);
  mapLayers = {};
  const acts = Object.values(s.activities).filter((a) => a.status === 'active');
  // curved funding flows venue -> project
  acts.forEach((a, i) => {
    const v = s.venues[a.venueId]; const p = s.projects[a.projectId]; if (!v?.lat || !p?.lat) return;
    const pts = []; const mx = (v.lat + p.lat) / 2 + (p.lng - v.lng) * 0.25; const my = (v.lng + p.lng) / 2 - (p.lat - v.lat) * 0.25;
    for (let k = 0; k <= 24; k++) { const u = k / 24; pts.push([(1 - u) ** 2 * v.lat + 2 * (1 - u) * u * mx + u * u * p.lat, (1 - u) ** 2 * v.lng + 2 * (1 - u) * u * my + u * u * p.lng]); }
    L.polyline(pts, { color: p.color, weight: 3, opacity: 0.85, className: `flowline fl${i % 3}`, interactive: false }).addTo(map);
  });
  for (const v of Object.values(s.venues)) {
    if (!v.lat) continue;
    const acts2 = acts.filter((a) => a.venueId === v.id);
    const m = L.marker([v.lat, v.lng], { icon: L.divIcon({ className: '', html: `<div class="mk mk-v"><img src="${img(v.img || 'newVenue', 120)}" alt=""><span>${acts2.length}</span></div>`, iconSize: [52, 52], iconAnchor: [26, 26] }) }).addTo(map);
    m.bindPopup(`<div class="pop">${photo(v.img || 'newVenue', 'pop-ph')}<b>${esc(v.name)}</b><small>${esc(tx(v.type))} · ${esc(v.address || v.neighbourhood)}</small>${acts2.map((a) => { const ne = editionsOf(s, a.id).find((e) => e.status === 'scheduled' && e.date >= TODAY); return `<div class="pop-a"><span>${esc(tx(a.title))}<small>${esc(s.people[a.promoterId].name)}${ne ? ` · ${fmtDate(ne.date)}` : ''}</small></span>${ne ? `<button data-open="ed" data-id="${ne.id}">${money(a.priceCents)}</button>` : ''}</div>`; }).join('')}</div>`, { maxWidth: 280, closeButton: false });
    mapLayers[`v:${v.id}`] = m;
  }
  for (const p of Object.values(s.projects)) {
    if (!p.lat) continue;
    const st = projectStats(s, p.id);
    const m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="mk mk-p" style="--c:${p.color}"><i></i><img src="${img(p.img, 120)}" alt=""></div>`, iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(map);
    m.bindPopup(`<div class="pop">${photo(p.img, 'pop-ph')}<b>${esc(p.name)}</b><small>${esc(tx(p.cause))}</small><div class="pop-a"><span>${t('raised')}<small>${t('of_goal', { g: money0(p.goalCents) })}</small></span><strong>${money0(st.transferred + st.donations)}</strong></div></div>`, { maxWidth: 260, closeButton: false });
    mapLayers[`p:${p.id}`] = m;
  }
  const pts = [...Object.values(s.venues), ...Object.values(s.projects)].filter((x) => x.lat).map((x) => [x.lat, x.lng]);
  const fit = () => map && pts.length && map.fitBounds(pts, { paddingTopLeft: [innerWidth > 1000 ? 340 : 30, 40], paddingBottomRight: [30, 30], maxZoom: 15, animate: false }) && map.getZoom() < 13 && map.setZoom(13, { animate: false });
  fit(); setTimeout(() => { if (map) { map.invalidateSize(); fit(); } }, 250);
}

const STEPS = ['step_format', 'step_venue', 'step_project', 'step_details', 'step_agreement'];

  const s = state;
  if (isVenue()) return studioShell('create', `<div class="scard"><p>${t('switch_to_org')}</p><div class="cta">${promoters(s).map((p) => `<button class="btn" data-act="acct" data-id="person:${p.id}">${avatar(p, 'xs')} ${esc(p.name)}</button>`).join('')}</div></div>`);

  const body = [wizFormat, wizVenue, wizProject, wizDetails, wizAgreement][d.step - 1](s, d);
  const canNext = (d.step === 1 && d.templateId) || (d.step === 2 && d.venueId) || (d.step === 3 && d.projectId) || d.step === 4;
  return studioShell('create', `<div class="shead rv"><div><h1>${t('create_activity')}</h1><p class="muted">${d.fromActivityId ? t('prefilled_from', { a: tx(s.activities[d.fromActivityId].title) }) : t('create_sub')}</p></div><button class="btn btn-ghost btn-s" data-act="wiz-reset">${t('start_over')}</button></div>

function wizCalc(s, d) {
  const v = s.venues[d.venueId]; const tp = s.templates[d.templateId]; const st = templateStats(s, tp.id);
  const act = { priceCents: d.priceCents, promoterId: d.promoterId, venueId: d.venueId, projectId: d.projectId };
  const tick = ticketSplit(s, act); const slices = slicesOf(s, tick);
  const expected = Math.min(d.capacity, Math.max(d.minBookings, st.avgAttendance));
  const per = tick.lines.find((l) => l.key === 'promoter').cents;
  const earn = (n) => splitSales({ salesCents: n * d.priceCents, promoterId: d.promoterId, venueId: d.venueId, projectId: d.projectId }, s.people).lines.find((l) => l.key === 'promoter').cents;
  const be = per ? Math.ceil(d.costsCents / per) : 0;
  const warn = [];
  if (d.capacity > v.capacity) warn.push(t('w_cap', { v: v.name, n: v.capacity }));
  if (d.minBookings < v.minAttendance) warn.push(t('w_min', { v: v.name, n: v.minAttendance }));
  if (d.minBookings > d.capacity) warn.push(t('w_minmax'));
  if (be > d.minBookings) warn.push(t('w_be', { n: be, m: d.minBookings }));
  const sc = [['w_at_min', d.minBookings], ['w_expected', expected], ['w_full', d.capacity]];
  const maxE = Math.max(1, earn(d.capacity));
  return `<div class="wcalc"><div class="dwrap">${donut(slices, money(d.priceCents), t('per_ticket'))}</div>${legend(slices)}</div>
    <div class="scen">${sc.map(([k, n]) => `<div class="sc"><span>${t(k)} · ${n}</span><div class="hbar big"><b style="--w:${(earn(n) / maxE) * 100}%"></b></div><b class="num">${money(earn(n))}</b><small>${money(Math.round((earn(n) - d.costsCents) / tp.hours))}/h</small></div>`).join('')}</div>
    <p class="small muted">${t('w_calc_note', { h: tp.hours, be, c: money(d.costsCents) })}</p>${warn.map((w) => `<p class="warn">⚠ ${esc(w)}</p>`).join('')}`;
}

const ROUTES = [
  [/^#\/?$/, 'site', () => siteView()],
  [/^#\/e\/([\w-]+)$/, 'site', () => siteView()],
  [/^#\/me$/, 'me', () => meView()],
  [/^#\/studio\/?$/, 'studio', () => studioOverview()],
  [/^#\/studio\/activities$/, 'studio', () => studioActivities()],
  [/^#\/studio\/edition\/([\w-]+)$/, 'studio', (m) => studioEdition(m[1])],
  [/^#\/studio\/create$/, 'studio', () => studioCreate()],
  [/^#\/studio\/payouts$/, 'studio', () => studioPayouts()],
  [/^#\/studio\/referrals$/, 'studio', () => studioReferrals()],
  [/^#\/studio\/requests$/, 'studio', () => studioRequests()],
  [/^#\/studio\/venue$/, 'studio', () => studioVenue()],
  [/^#\/studio\/new-venue$/, 'studio', () => studioNewVenue()],
];
const SECTIONS = ['explore', 'map', 'money', 'network', 'projects', 'organise'];
let lastHash = null; let forceAnimate = false; let pendingSection = null; let netIntro = true; let dropMap = false;

function render() {
  const hash = location.hash || '#/';
  const route = ROUTES.find(([re]) => re.test(hash)) || ROUTES[0];
  const [re, name, view] = route;
  const same = hash === lastHash; const animate = !same || forceAnimate;
  lastHash = hash; forceAnimate = false;
  if (name === 'site') netIntro = !same;
  const app = $('#app');
  // keep the live map element across re-renders of the same page
  let keepMap = null;
  if (same && !dropMap && name === 'site' && map) { keepMap = $('#leaflet'); keepMap?.remove(); }
  if (dropMap && map) { map.remove(); map = null; }
  dropMap = false;
  const active = document.activeElement; const host = active?.name ? active.closest('[data-live]') : null;
  const focusSel = host ? `[data-live="${host.dataset.live}"] [name="${active.name}"]` : null;
  try { app.innerHTML = view(hash.match(re)); } catch (err) { console.error(err); app.innerHTML = `<div class="wrap hero"><h2>${t('error')}</h2><pre class="small">${esc(err.message)}</pre><button class="btn" data-act="reset">${t('reset_data')}</button></div>`; }
  if (keepMap) $('#leaflet')?.replaceWith(keepMap);
  if (focusSel) app.querySelector(focusSel)?.focus();
  document.body.dataset.view = name;
  armReveals(app, animate);
  updateNav(name);
  if (name === 'site') { if (keepMap) map.invalidateSize(); else initMap(); observeSections(); }
  if (!same) {
    if (pendingSection) { const id = pendingSection; pendingSection = null; requestAnimationFrame(() => $(`#${id}`)?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' })); } else window.scrollTo(0, 0);
    const m = hash.match(/^#\/e\/([\w-]+)$/); if (m && state.editions[m[1]]) setTimeout(() => openSheet(() => sheetEdition(m[1])), 300);
  }
}

function updateNav(name) {
  $('#navLinks').innerHTML = name === 'site'
    ? SECTIONS.map((id) => `<a href="#/" data-sec="${id}">${t(`nav_${id}`)}</a>`).join('')
    : `<a href="#/">${t('nav_home')}</a>${name === 'studio' ? `<a class="on" href="#/studio">Studio</a>` : `<a class="on" href="#/me">${t('my_tickets')}</a>`}`;
  $('#fabMenu').innerHTML = `${SECTIONS.map((id) => `<a href="#/" data-sec="${id}">${t(`nav_${id}`)}</a>`).join('')}<a href="#/me">${t('my_tickets')}</a><a href="#/studio">Studio</a>`;
  $('#navStudio').classList.toggle('on', name === 'studio');
  $('#navMe').classList.toggle('on', name === 'me');
  $('#navStudio span').textContent = 'Studio';
  $('#navMe').setAttribute('aria-label', t('my_tickets'));
}

let secIO = null;
function observeSections() {
  secIO?.disconnect();
  secIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) $$('#navLinks a, #fabMenu a').forEach((a) => a.classList.toggle('on', a.dataset.sec === e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
  SECTIONS.forEach((id) => { const el = $(`#${id}`); if (el) secIO.observe(el); });
}
